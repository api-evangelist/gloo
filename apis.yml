aid: gloo
name: Gloo
description: >-
  Gloo is Solo.io's family of open-source and enterprise API gateway, service mesh and
  developer portal products, built on Envoy Proxy and Istio and delivered as software the
  customer runs in their own Kubernetes clusters rather than as a hosted SaaS. Gloo Edge and
  Gloo Gateway provide ingress, advanced traffic management, external auth, rate limiting,
  WAF, GraphQL and AI/LLM traffic routing; Gloo Mesh manages multi-cluster Istio; and Gloo
  Portal publishes API products to internal and external consumers with teams, applications,
  subscriptions, API keys and OAuth credentials. Solo.io renamed its commercial line in 2026 —
  Gloo Gateway is now Solo Enterprise for kgateway and Gloo Mesh is now Solo Enterprise for
  Istio — and the upstream kgateway project is a conformant implementation of the Kubernetes
  Gateway API, passing 93 of 93 core and extended conformance tests against v1.6.1.
