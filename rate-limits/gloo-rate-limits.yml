description: >-
  Published rate limits on Gloo's own APIs: none. This is a correct and expected zero, not a
  documentation gap. Gloo is software the customer deploys — the Gloo Portal server runs in the
  customer's own cluster, so there is no vendor-imposed quota to publish and no vendor to
  enforce one. This file replaces a 2026-05-04 bulk-sweep scaffold that invented a 10
  requests-per-minute free tier with a burst of 20 and a full set of X-RateLimit-* headers.
  None of that appears in any Solo.io contract or document.
