inverted_finding:
  note: >-
    The interesting fact runs the other way. Rate limiting is one of Gloo's headline PRODUCT
    capabilities and is modelled as first-class data in Solo's own published contracts — it is
    simply applied to the customer's APIs, by the customer, rather than to Solo's.
  evidence:
    - artifact: openapi/gloo-platform-portal-openapi.yaml
      schema: RateLimitPolicy
      shape: '{ unit: SECOND|MINUTE|HOUR|DAY|MONTH|YEAR, requestsPerUnit: integer }'
      attached_to: UsagePlan.rateLimitPolicy, returned by GetUsagePlans
    - artifact: openapi/gloo-portal-server-openapi.yaml
      schema: RateLimit
      shape: '{ unit: SECOND|MINUTE|HOUR|DAY|MONTH|YEAR, requestsPerUnit: string }'
      note: >-
        Same concept, but requestsPerUnit is typed `string` here and `integer` in the Gloo
        Platform contract — a real divergence between two contracts Solo.io publishes.
    - artifact: projects/gloo/api/v1/enterprise/options/ratelimit/ratelimit.proto
      note: The Envoy rate-limit filter configuration shipped in solo-io/gloo.
    - artifact: projects/gloo/api/v1/options/local_ratelimit/local_ratelimit.proto
      note: Per-instance local rate limiting, distinct from the global rate-limit service.
    - artifact: projects/gloo/api/v1/options/connection_limit/connection_limit.proto
      note: Connection-level limiting.
  docs:
    - https://docs.solo.io/gloo-edge/latest/guides/security/rate_limiting/
gaps:
  - >-
    An agent calling a deployed Gloo Portal cannot discover the operator's limits from the
    contract: no 429 is declared, so it has no documented signal to back off on, and the limits
    that DO apply are whatever UsagePlan the operator attached.
