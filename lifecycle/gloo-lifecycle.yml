method: searched
source: >-
  https://docs.solo.io/gloo-edge/latest/reference/support/ (release support policy),
  https://docs.solo.io/gateway/latest/reference/changelog/ (version streams),
  https://docs.solo.io/gloo-mesh-enterprise/latest/reference/version/ (Gloo Mesh versions),
  https://github.com/solo-io/gloo/releases (dated releases), https://legal.solo.io/ (technical
