self_install_trial:
  exists: true
  note: >-
    The strongest "sandbox" of all for this product class: Gloo Edge / kgateway open source is
    Apache-2.0 and installable in one command (`glooctl install gateway`, or the Helm chart), so
    a prospective user can run the real thing locally on kind or minikube without talking to
    anyone. Enterprise features require a licence key obtained from Solo.io.
