description: >-
  Gloo has no test mode, no sandbox API keys and no test-vs-live key prefixes — there is nothing
  to have them on, because there is no Solo.io-hosted API to call. What Solo.io provides instead
  is a genuinely substantial try-before-you-install surface: browser-based hands-on labs that
  provision a real cluster running the real product, plus local demo fixtures shipped in the
  repositories.
test_mode:
