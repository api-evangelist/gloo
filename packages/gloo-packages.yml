description: >-
  First-party client libraries, source modules, charts and binaries published by Solo.io for
  the Gloo family (Gloo Edge / Gloo Gateway / Solo Enterprise for kgateway, Gloo Mesh and
  Gloo Portal). Gloo is installed software, not a hosted SaaS, so the distribution surface is
  Go modules, a Helm chart and signed CLI binaries rather than per-language REST SDKs. The one
  true client SDK is solo-io/kgateway-client, the generated Go clientset for the Solo
  Enterprise for kgateway (formerly Gloo Gateway) CRD APIs.
notes:
  - >-
    PyPI has a package literally named `gloo` (Gloo 0.1.2, "Project management for data
    analysis projects"). It is NOT Solo.io's and is deliberately excluded — see the
    ownership note under excluded[].
  - >-
    Solo.io rebranded its commercial products in 2026: Gloo Gateway is now Solo Enterprise
    for kgateway, Gloo Mesh is now Solo Enterprise for Istio. Package names still carry the
    Gloo lineage, which is why they appear under this record.
