divergences:
  - >-
    RateLimit.requestsPerUnit is `string` in the Gloo Portal Server contract and `integer` in
    the Gloo Platform Portal contract. Same field, same meaning, different type — a client
    written against one will mis-parse the other.
  - >-
    The two portal contracts model the same domain at different granularities. Gloo Platform
    Portal is user-centric and flat (/me, /apis, /api-keys, /usage-plans). Gloo Portal Server
    is team-centric and nested (/teams/{teamId}/apps/{appId}/api-keys). The newer contract
    added Team, Application, APIProduct, ProductVersion, Subscription and OAuthCredential and
    dropped API, UsagePlan, AuthPolicy and RateLimitPolicy.
