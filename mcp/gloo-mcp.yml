generated: '2026-09-12'
method: derived
status: candidate
source: >-
  Derived from the four published Solo.io OpenAPI contracts in openapi/ on 2026-09-12, after a
  search for a published Solo.io MCP server found none. Searched: https://www.solo.io/llms.txt
  (which names MCP 40+ times but only as a product topic), the solo-io GitHub organization, the
  Solo.io product pages, and live probes of https://mcp.solo.io/ and https://mcp.solo.io/mcp
  (both fail to resolve, curl status 000) and https://docs.solo.io/mcp (404).
provider: Gloo
providerId: gloo
description: >-
  A CANDIDATE MCP tool surface derived from Solo.io's published OpenAPI contracts. Solo.io does
  NOT ship an MCP server for its own APIs, and nothing here should be read as one. The pointer
  in apis.yml is deliberately X-MCPServerCandidate, not MCPServer.
  The irony is worth recording: Solo.io is one of the most prominent MCP infrastructure vendors
  in the market — agentgateway is an AI-native gateway purpose-built for MCP traffic,
  agentregistry is a registry for MCP servers, and solo.io runs an "MCP Academy" — yet none of
  Solo.io's own management APIs is exposed to agents through MCP. The company builds the road;
  it has not driven on it.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    mode is `none` because no Solo.io MCP server exists — not remote, not stdio. No endpoint is
    guessed. If Solo.io later publishes one, this file must be re-derived by SEARCH, and the
    pointer upgraded to MCPServer.
search_evidence:
  - url: https://mcp.solo.io/
    status: '000'
    note: Host does not resolve.
  - url: https://mcp.solo.io/mcp
    status: '000'
    note: Host does not resolve.
  - url: https://docs.solo.io/mcp
    status: 404
  - url: https://www.solo.io/llms.txt
    status: 200
    note: >-
      40+ MCP references, all product/marketing/education content (MCP Academy, agentgateway,
      agentregistry, "Secure your MCP servers with OAuth"). No server endpoint, no npx package,
      no mcp.json.
  - url: https://api.github.com/orgs/solo-io/repos
    status: 200
    note: >-
      No MCP-server repository under solo-io for Solo's own APIs. Related repos found
      (kmcp, deployment-guide-mcp-optimization-on-k8s, enterprise-mcp-flow) are tooling for
      running OTHER people's MCP servers on Kubernetes.
surfaces:
  openapi:
    - openapi/gloo-portal-server-openapi.yaml
    - openapi/gloo-platform-portal-openapi.yaml
    - openapi/gloo-portal-idp-connect-openapi.yaml
    - openapi/gloo-ai-gateway-guardrail-webhook-openapi.yaml
  graphql: null
  mcp: null
  grpc:
    - grpc/gloo-gloo-validation.proto
    - grpc/gloo-proxy-endpoint.proto
derivation_notes:
  - >-
    One candidate tool per OpenAPI operation, 39 in total. Tool names are namespaced by
    contract (gloo_portal_*, gloo_platform_portal_*, gloo_idp_connect_*, gloo_guardrail_*)
    because GetCurrentUser and DeleteAPIKey each appear in two different contracts with
    different paths.
  - >-
    Each tool's real inputSchema is the referenced operation's parameters + requestBody;
    input_schema_source names the exact JSON Pointer rather than restating the schema here.
  - >-
    21 of the 39 are MUTATING and NONE of them is idempotent (no Idempotency-Key anywhere —
    see conventions/gloo-conventions.yml). Any server built from this list should mark those
    tools destructive and non-retryable.
  - >-
    The two gloo_guardrail_* tools are a different animal: they are endpoints the OPERATOR
    implements and the gateway calls, not endpoints an agent calls. A server built from this
    list should exclude them or clearly mark them as inbound webhooks.
  - >-
    The gRPC surface (GlooValidationService.Validate, .NotifyOnResync,
    ProxyEndpointService.GetProxies) is NOT represented as tools here — the derivation is
    OpenAPI-only, and NotifyOnResync is a server-streaming RPC with no MCP equivalent.
