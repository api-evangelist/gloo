description: >-
  Error catalog for the Gloo HTTP surface. Solo.io does NOT publish an RFC 9457
  application/problem+json envelope anywhere in these contracts, and there is no numeric or
  string error-code registry: 142 of the 148 declared error responses carry a prose description
  and no response body schema at all. Two envelopes exist, and only on two of the four
  contracts. Everything below is derived from the specs, not invented.
format: none
format_note: >-
  Not RFC 9457. No `type`/`title`/`status`/`detail`/`instance` problem document, no
  application/problem+json media type, and no stable machine-readable error code. Agents must
  branch on the HTTP status code and, where present, on prose in `message`/`reason`.
envelopes:
  - name: Error
    used_by: gloo-portal-idp-connect
    media_type: application/json
    schema: openapi/gloo-portal-idp-connect-openapi.yaml#/components/schemas/Error
    required:
      - code
      - message
      - reason
    fields:
      code: integer — repeats the HTTP status code
      message: string — e.g. "Status Code Message"
      reason: string — e.g. "Error reason"
    note: The only first-class error envelope Solo.io defines. It is scoped to the two IdP Connect operations.
  - name: HTTPValidationError
    used_by: gloo-ai-gateway-guardrail-webhook
    media_type: application/json
    schema: openapi/gloo-ai-gateway-guardrail-webhook-openapi.yaml#/components/schemas/HTTPValidationError
    fields:
      detail: array of ValidationError { loc[], msg, type }
    note: >-
      The standard FastAPI/Pydantic 422 validation envelope, present because the reference
      guardrail webhook server is a FastAPI application. It is the guardrail contract's ONLY
      declared error response.
  - name: none
    used_by:
      - gloo-portal-server
      - gloo-platform-portal
    media_type: null
    note: >-
      The two Portal server contracts declare 85 error responses with a human description and
      NO content schema. A client cannot parse these responses; it can only read the status
      code. This is the single largest error-semantics gap in the Gloo surface.
